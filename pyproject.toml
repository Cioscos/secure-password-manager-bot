[project]
name = "password-bot"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[job-queue,callback-data]>=22.8",
    "cryptography",
    "argon2-cffi",
    "aiosqlite",
    "thefuzz",
    "python-Levenshtein",
    "zxcvbn-python",
    "structlog",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "freezegun",
    "hypothesis",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/password_bot"]
